name: Set goframe topics and homepage

on:
  push:
    branches: [main]
    paths: [".github/workflows/goframe-settings.yml"]

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - name: Set homepage and topics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh api -X PATCH repos/polymatx/goframe -f homepage="https://polymatx.dev/blog/posts/goframe-batteries-included-go-web-framework/" --jq '"homepage: " + .homepage'
          gh api -X PUT repos/polymatx/goframe/topics --input - --jq '"topics: " + (.names | join(", "))' <<'JSON'
          {"names":["go","golang","web-framework","go-framework","rest-api","microservices","middleware","jwt","authentication","gorm","postgresql","mysql","sqlite","mongodb","redis","rabbitmq","mqtt","websocket","dependency-injection","backend"]}
          JSON
