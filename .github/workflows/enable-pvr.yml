name: Enable private vulnerability reporting

on:
  push:
    branches: [main]
    paths: [".github/workflows/enable-pvr.yml"]

permissions:
  contents: read

jobs:
  pvr:
    runs-on: ubuntu-latest
    steps:
      - name: Enable on dibs and opsgate
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          for repo in dibs opsgate; do
            gh api -X PUT "repos/polymatx/$repo/private-vulnerability-reporting" --silent
            gh api "repos/polymatx/$repo/private-vulnerability-reporting" --jq "\"$repo: enabled=\" + (.enabled|tostring)"
          done
